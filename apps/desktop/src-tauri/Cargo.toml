[package]
name = "breath-and-word-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Breath & Word desktop (Tauri v2) native content-DB layer"

[lib]
name = "breath_and_word_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Pack file I/O (B3 §4.1 `pack_io.rs`): gzip decompression + native SHA-256 for the FR-105
# atomic attach/update protocol. All three are already in the Tauri dependency tree.
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

# The B4 §4.6 2x-free-space headroom check needs a platform disk-space query.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enabled by `tauri build`; the dev binary talks to the Vite dev server instead.
custom-protocol = ["tauri/custom-protocol"]
