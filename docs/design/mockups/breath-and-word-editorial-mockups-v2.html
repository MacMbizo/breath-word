      border-radius: 38px;

      display: flex;
      flex-direction: column;
      position: relative;
      transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease;

      background-color: var(--bw-canvas);
      color: var(--bw-text);
      border: 1px solid var(--bw-border-strong);

      // =======================================================================

                    Pray this promise
                  </button>
                  <button data-act="toggle-today-keep" class="py-2.5 px-4 rounded-full text-[13px] font-medium border cursor-pointer" style="${

              <div class="space-y-2">

                  ${Object.keys(CIRCUMSTANCE_PEEK)
                    .map((c) => {

                          ? 'background: var(--bw-accent); color: var(--bw-on-accent); border-color: var(--bw-accent);'

                      }">${esc(c)}</button>`;

                </div>
                <div class="p-3 rounded-2xl border space-y-1.5" style="background: var(--bw-sanctum); border-color: var(--bw-sanctum-border);">

                    <span class="font-semibold" style="color: var(--sig-promise);">${esc(peek.ref)}</span>

                  <p class="font-scripture text-[13px] leading-snug" style="color: var(--bw-text);">“${esc(peek.text)}”</p>
                </div>
              </div>

                </div>

                <!-- Kept Item 1 (Answered + Tap for E2EE Testimony) -->
                <button data-act="toggle-testimony" class="w-full text-left p-3.5 rounded-2xl border space-y-1.5 cursor-pointer" style="background: var(--bw-surface); border-color: var(--bw-border);">

                <div class="p-3.5 rounded-2xl border flex items-center justify-between gap-2" style="background: var(--bw-surface); border-color: var(--bw-border);">
                  <div class="min-w-0">
                    <div class="font-semibold text-[13.5px]" style="color: var(--bw-text);">Psalm 56:3</div>
                    <div class="font-scripture text-[13px] truncate" style="color: var(--bw-secondary);">What time I am afraid, I will trust…</div>
                  </div>
                  <span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-medium shrink-0" style="background: var(--bw-elevated); color: var(--bw-secondary);">Prayed 3×</span>

            ${floatingPill('Pray')}
          </div>`;

      // =======================================================================
      // SCREEN 4: TRUTH CHAIN — ILLUMINATED THREAD (FR-507)
      // =======================================================================
      function renderScreen4(phoneTheme) {
        const chain = TRUTH_CHAINS[state.chainId];
        const previewNode = chain.nodes.find((n) => n.id === state.chainNodePreviewId) || null;

        return `
          <div class="bw-phone bw-${phoneTheme}">
            <!-- Top Navigation -->
            <div class="px-4 pt-4 pb-2 flex items-center justify-between gap-2 shrink-0">

                ${iconChain('var(--bw-accent)', 15)}
                <span>Truth Chain</span>
              </div>
              <div class="flex items-center gap-1 overflow-x-auto bw-scroll">
                ${Object.values(TRUTH_CHAINS)
                  .map(
                    (c) => `<button data-act="pick-chain" data-id="${c.id}" class="px-2.5 py-1 rounded-full text-[11.5px] font-medium border shrink-0 cursor-pointer" style="${
                      c.id === chain.id
                        ? 'background: var(--bw-accent); color: var(--bw-on-accent); border-color: var(--bw-accent);'
                        : 'background: var(--bw-elevated); color: var(--bw-secondary); border-color: var(--bw-border);'

            <div class="flex-1 overflow-y-auto bw-scroll px-4 pb-20 space-y-3">

                previewNode

                    <div class="p-4 rounded-[22px] border space-y-3" style="background: var(--bw-surface); border-color: var(--bw-accent);">
                      <div class="flex items-center justify-between">
                        <button data-act="chain-back" class="px-3 py-1 rounded-full text-[12px] font-semibold cursor-pointer" style="background: var(--bw-accent); color: var(--bw-on-accent);">
                          ← Return to ${esc(chain.anchorRef)}
                        </button>
                        <span class="bw-micro-label" style="color: var(--bw-secondary);">${esc(previewNode.tag)}</span>
                      </div>
                      <div class="font-display text-2xl font-medium" style="color: var(--bw-text);">${esc(previewNode.ref)}</div>
                      <p class="font-scripture text-[16px] leading-relaxed" style="color: var(--bw-text);">
                        ${esc(previewNode.text)}
                      </p>
                      <div class="text-[11.5px] pt-1 border-t" style="border-color: var(--bw-border); color: var(--bw-secondary);">
                        Linked from ${esc(chain.anchorRef)} · ${esc(previewNode.source)}
                      </div>
                    </div>`
                  : `<!-- Anchor Illuminated Card -->
                    <div class="p-4 rounded-[22px] border space-y-2.5" style="background: var(--bw-surface); border-color: var(--bw-border-strong);">
                      <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5">
                          ${iconChain('var(--sig-promise)', 14)}
                          <span class="bw-micro-label" style="color: var(--sig-promise);">${esc(chain.relationLabel)}</span>
                        </div>
                        <span class="text-[12px] font-medium" style="color: var(--bw-secondary);">${esc(chain.anchorRef)}</span>
                      </div>
                      <p class="font-scripture text-[16px]" style="line-height: var(--bw-lh); color: var(--bw-text);">
                        <span class="bw-dotted-part">${esc(chain.anchorPart1)}</span>
                        <span> </span>
                        <span class="bw-solid-promise">${esc(chain.anchorPart2)}</span>
                      </p>
                      <div class="flex items-center justify-between text-[11px]" style="color: var(--bw-secondary);">
                        <span><span class="bw-dotted-part">${esc(chain.leftLabel)}</span> · <span class="bw-solid-promise">${esc(chain.rightLabel)}</span></span>

                        .map(
                          (nd) => `<button data-act="chain-node" data-id="${nd.id}" class="relative w-full text-left p-3.5 rounded-2xl border cursor-pointer transition" style="background: var(--bw-surface); border-color: var(--bw-border);">

            ${floatingPill('Read')}
          </div>`;

      // =======================================================================
      // SCREEN 5: UNFOLDING STORY — CHRONOLOGICAL MONOGRAPH
      // =======================================================================
      function renderScreen5(phoneTheme) {
        const m = STORY_MOMENTS[state.storyId];
        const ticks = ['Gen', 'Exod', 'David', 'Kings', 'Exile', 'Acts'];

        const blocksHtml = m.blocks
          .map((blk) => {
            if (blk.type === 'divider') {
              return `
                <div class="flex items-center gap-2.5 py-2">
                  <span class="h-px flex-1" style="background: var(--bw-border-strong);"></span>
                  <span class="font-scripture italic text-[12px] shrink-0" style="color: var(--bw-rubric);">${esc(blk.text)}</span>
                  <span class="h-px flex-1" style="background: var(--bw-border-strong);"></span>

            }

            if (blk.type === 'poetry') {
              return `
                <div class="pl-3.5 space-y-2" style="border-left: 2px solid var(--sig-promise);">
                  ${blk.verses
                    .map((vs) => {
                      const hasSig = state.storySignalsOn && vs.sig;
                      const formatted = esc(vs.text).replace(/\n/g, '<br/>');
                      return `<div class="flex items-start gap-2">
                        <span class="w-4 pt-1 shrink-0">${hasSig ? sigIcon(vs.sig, 14) : ''}</span>
                        <p class="font-scripture italic text-[15px] flex-1" style="line-height: 1.72; color: var(--bw-text);">
                          <sup class="font-ui not-italic mr-1" style="color: var(--bw-verse); font-size: 10.5px;">${vs.v}</sup><span class="${
                        hasSig && vs.sig === 'PROMISE' ? 'bw-solid-promise' : ''
                      }">${formatted}</span>
                        </p>
                      </div>`;
                    })
                    .join('')}
                </div>`;
            }

            return `
              <div class="space-y-1.5">
                ${blk.verses
                  .map((vs) => {
                    const hasSig = state.storySignalsOn && vs.sig;
                    return `<div class="flex items-start gap-2">
                      <span class="w-4 pt-1 shrink-0">${hasSig ? sigIcon(vs.sig, 14) : ''}</span>
                      <p class="font-scripture text-[15.5px] flex-1" style="line-height: var(--bw-lh); color: var(--bw-text);">
                        <sup class="font-ui mr-1" style="color: var(--bw-verse); font-size: 10.5px;">${vs.v}</sup><span class="${
                      hasSig && vs.sig === 'PROMISE' ? 'bw-solid-promise' : ''
                    }">${esc(vs.text)}</span>
                      </p>
                    </div>`;
                  })
                  .join('')}
              </div>`;
          })
          .join('');

        return `
          <div class="bw-phone bw-${phoneTheme}">
            <!-- Top Bar -->
            <div class="px-4 pt-4 pb-2 flex items-center justify-between gap-2 shrink-0">
              <button data-act="cycle-story" class="px-3 py-1.5 rounded-full text-[12px] font-medium border flex items-center gap-1.5 cursor-pointer" style="background: var(--bw-elevated); border-color: var(--bw-border); color: var(--bw-text);" title="Tap to switch chronological moment">
                ${iconStory('var(--bw-accent)', 13)}
                <span>${esc(m.eraShort)}</span>
                <span style="color: var(--bw-secondary);">▾</span>
              </button>
              <button data-act="toggle-story-sig" class="px-3 py-1.5 rounded-full text-[12px] font-medium flex items-center gap-1 cursor-pointer" style="${
                state.storySignalsOn
                  ? 'background: var(--bw-accent); color: var(--bw-on-accent);'
                  : 'background: var(--bw-elevated); color: var(--bw-secondary); border: 1px solid var(--bw-border);'
              }">
                ${iconPromise(state.storySignalsOn ? 'var(--bw-on-accent)' : 'var(--bw-secondary)', 13)}

              </button>
            </div>

            <!-- Minimalist Hairline Story Arc -->
            <div class="px-5 py-1.5 shrink-0">
              <div class="relative flex items-center justify-between text-[10.5px]" style="color: var(--bw-secondary);">
                <span class="absolute left-2 right-2 top-1.5 h-px" style="background: var(--bw-border-strong);"></span>
                ${ticks
                  .map((tk, idx) => {
                    const act = idx === m.eraIndex;
                    return `<div class="relative flex flex-col items-center gap-0.5 z-10">
                      <span class="w-2.5 h-2.5 rounded-full border" style="${
                        act
                          ? 'background: var(--bw-accent); border-color: var(--bw-accent); transform: scale(1.15);'
                          : 'background: var(--bw-canvas); border-color: var(--bw-border-strong);'
                      }"></span>
                      <span class="${act ? 'font-semibold' : ''}" style="${act ? 'color: var(--bw-accent);' : ''}">${tk}</span>
                    </div>`;
                  })
                  .join('')}
              </div>

            <!-- Monograph Scroll Body -->
            <div class="flex-1 overflow-y-auto bw-scroll px-5 pb-24 space-y-3">
              <div class="pt-1 space-y-0.5">
                <div class="bw-micro-label" style="color: var(--bw-secondary); letter-spacing: 0.09em;">${esc(m.subtitle)}</div>

            <div class="absolute inset-x-3 bottom-16 z-20">
              ${
                state.storyDrawerOpen
                  ? `<div class="p-3.5 rounded-2xl border shadow-xl space-y-2" style="background: var(--bw-surface); border-color: var(--bw-border-strong);">
                      <div class="flex items-center justify-between">
                        <span class="bw-micro-label flex items-center gap-1" style="color: var(--bw-accent);">
                          ${iconPin('var(--bw-accent)', 12)} ${esc(m.location)}
                        </span>
                        <button data-act="toggle-story-drawer" class="text-[11.5px] font-medium cursor-pointer" style="color: var(--bw-secondary);">Close ✕</button>
                      </div>
                      <p class="text-[12px] leading-relaxed" style="color: var(--bw-secondary);">${esc(m.summary)}</p>
                      <div class="flex flex-wrap gap-1.5">
                        ${m.figures
                          .map((f) => `<span class="px-2 py-0.5 rounded-full text-[11px] border" style="background: var(--bw-elevated); border-color: var(--bw-border); color: var(--bw-text);">${esc(f)}</span>`)
                          .join('')}
                      </div>
                      <div class="text-[11px] pt-1 border-t flex items-center justify-between" style="border-color: var(--bw-border); color: var(--bw-accent);">
                        <span>Open in canonical reader</span>
                        <span class="font-mono">${esc(m.canonicalCode)}</span>
                      </div>
                    </div>`
                  : `<button data-act="toggle-story-drawer" class="w-full px-3.5 py-2 rounded-full border flex items-center justify-between text-[11.5px] cursor-pointer shadow-sm" style="background: var(--bw-surface); border-color: var(--bw-border-strong); color: var(--bw-secondary);">
                      <span class="flex items-center gap-1.5 truncate">${iconPin('var(--bw-accent)', 12)} ${esc(m.location)}</span>
                      <span class="font-medium shrink-0 ml-2" style="color: var(--bw-accent);">Context ↑</span>
                    </button>`
              }
            </div>

            <div class="pointer-events-none absolute inset-x-0 bottom-0 h-20" style="background: linear-gradient(to top, var(--bw-canvas) 45%, transparent);"></div>
            ${floatingPill('Read')}
          </div>`;
      }

      // =======================================================================
      // MODE 2: DESKTOP & IPAD STUDIO SPREAD
      // =======================================================================
      function renderDesktopStudio() {
        const theme = state.themeOverride === 'mix' ? 'selah' : state.themeOverride;
        const navItems = [
          { id: 'signals', label: 'Scripture Signals' },
          { id: 'truth', label: 'Truth Chain' },
          { id: 'story', label: 'Unfolding Story' },
        ];

        const sidebar = `
          <aside class="w-56 shrink-0 border-r p-4 flex flex-col justify-between" style="background: var(--bw-surface); border-color: var(--bw-border);">
            <div class="space-y-6">
              <div class="flex items-center justify-between">
                <span class="font-display text-2xl font-semibold tracking-tight" style="color: var(--bw-text);">
                  Breath <span class="italic" style="color: var(--bw-rubric);">&amp;</span> Word
                </span>
              </div>
              <div class="space-y-1 text-[13px]">
                <div class="bw-micro-label px-2.5 pb-1" style="color: var(--bw-secondary);">Study &amp; Prayer</div>
                ${['Reader', 'Compare', 'Search'].map((r) => `<div class="px-2.5 py-1.5 rounded-lg" style="color: var(--bw-secondary);">${r}</div>`).join('')}
                ${navItems
                  .map((n) => {
                    const act = state.desktopTab === n.id;
                    return `<button data-act="desktop-tab" data-id="${n.id}" class="w-full text-left px-2.5 py-1.5 rounded-lg cursor-pointer transition" style="${
                      act
                        ? 'background: var(--bw-wash); color: var(--bw-on-wash); font-weight: 600;'
                        : 'color: var(--bw-secondary);'
                    }">${n.label}</button>`;
                  })
                  .join('')}
                ${['Prayer Pools', 'Library'].map((r) => `<div class="px-2.5 py-1.5 rounded-lg" style="color: var(--bw-secondary);">${r}</div>`).join('')}
              </div>
            </div>
            <div class="pt-3 border-t text-[12px] flex items-center justify-between" style="border-color: var(--bw-border); color: var(--bw-secondary);">
              <span class="flex items-center gap-1.5">${iconLock('var(--bw-accent)', 13)} Vault Unlocked</span>
              <span>Offline</span>
            </div>
          </aside>`;

        let centerHtml = '';
        let rightHtml = '';

        if (state.desktopTab === 'signals') {
          const verse = PROVERBS_3.find((x) => x.v === state.selectedVerseNum) || PROVERBS_3[1];
          const meta = sigMeta(verse.cat);
          const blankValue = state.customBlank.trim() || BLANK_PRESETS[state.blankIndex];

          centerHtml = `
            <div class="max-w-[60ch] mx-auto space-y-5">
              <div class="flex items-center justify-between">
                <div class="px-3.5 py-1.5 rounded-full text-[13px] font-medium border" style="background: var(--bw-elevated); border-color: var(--bw-border);">
                  Proverbs 3 · KJV ▾
                </div>
                <div class="inline-flex p-0.5 rounded-full border text-[12px]" style="background: var(--bw-sunken); border-color: var(--bw-border);">
                  <button data-act="reader-mode" data-val="quiet" class="px-3 py-1 rounded-full cursor-pointer" style="${
                    state.readerMode === 'quiet' ? 'background: var(--bw-surface); color: var(--bw-text);' : 'color: var(--bw-secondary);'
                  }">Quiet Page</button>
                  <button data-act="reader-mode" data-val="cards" class="px-3 py-1 rounded-full cursor-pointer" style="${
                    state.readerMode === 'cards' ? 'background: var(--bw-surface); color: var(--bw-text);' : 'color: var(--bw-secondary);'
                  }">Study Cards</button>
                </div>
              </div>
              <div class="flex items-baseline gap-4">
                <span class="font-display text-[56px] leading-none font-medium" style="color: var(--bw-rubric);">3</span>
                <div>
                  <div class="bw-micro-label" style="color: var(--bw-secondary); letter-spacing: 0.1em;">Trust in the Lord</div>
                  <div class="text-[12px] mt-0.5" style="color: var(--bw-secondary);"><span class="bw-dotted-part">your part</span> · <span class="bw-solid-promise">His promise</span></div>
                </div>
              </div>
              <div class="space-y-2">
                ${PROVERBS_3.map((item) => {
                  const isSel = item.v === state.selectedVerseNum;
                  const im = sigMeta(item.cat);
                  return `<button data-act="sel-v" data-v="${item.v}" class="w-full text-left flex items-start gap-3 rounded-2xl px-3 py-2 cursor-pointer transition" style="${
                    state.readerMode === 'cards'
                      ? `background: ${im.tint}; border: 1px solid ${isSel ? im.color : 'var(--bw-border)'};`
                      : isSel
                      ? 'background: var(--bw-surface); box-shadow: inset 0 0 0 1.2px var(--bw-border-strong);'
                      : ''
                  }">
                    <span class="w-5 pt-1.5 flex justify-center shrink-0">${sigIcon(item.cat, 16)}</span>
                    <span class="font-scripture text-[18.5px]" style="line-height: var(--bw-lh); color: var(--bw-text);">
                      <sup class="font-ui mr-1.5" style="color: var(--bw-verse); font-size: 11.5px;">${item.v}</sup>${
                    item.cat === 'PROMISE_COND'
                      ? `<span class="bw-dotted-part">${esc(item.part1)}</span> <span class="bw-solid-promise">${esc(item.part2)}</span>`
                      : item.cat === 'PROMISE'
                      ? `<span class="bw-solid-promise">${esc(item.part2)}</span>`
                      : esc(item.part1)
                  }
                    </span>
                  </button>`;
                }).join('')}
              </div>
            </div>`;

          rightHtml = `
            <div class="space-y-4">
              <div class="flex items-center justify-between">
                <span class="flex items-center gap-1.5 bw-micro-label" style="color: ${meta.color};">${sigIcon(verse.cat, 15)} ${meta.label}</span>
                <span class="text-[12.5px]" style="color: var(--bw-secondary);">${esc(verse.ref)}</span>
              </div>
              <div class="space-y-1">
                <div class="bw-micro-label" style="color: var(--sig-command);">Your Part</div>
                <p class="font-scripture text-[16px] leading-relaxed">${esc(verse.yourPart)}</p>
              </div>
              ${
                verse.hisPromise
                  ? `<div class="p-4 rounded-2xl border space-y-1" style="background: var(--bw-sanctum); border-color: var(--bw-sanctum-border);">
                      <div class="bw-micro-label" style="color: var(--sig-promise);">His Promise</div>
                      <div class="font-display text-2xl leading-snug">${esc(verse.hisPromise)}</div>
                    </div>`
                  : ''
              }
              <div class="p-3.5 rounded-2xl border space-y-1.5" style="background: var(--bw-sunken); border-color: var(--bw-border);">
                <div class="bw-micro-label" style="color: var(--bw-secondary);">A Prayer to Begin</div>
                <p class="font-scripture italic text-[14.5px] leading-relaxed">
                  ${esc(verse.prayerPrefix)}<button data-act="cycle-blank" class="px-2 py-0.5 rounded border not-italic font-ui text-[12px] font-medium cursor-pointer" style="background: var(--bw-wash); border-color: var(--bw-accent); color: var(--bw-on-wash);">${esc(blankValue)} ✎</button>${esc(verse.prayerMid)}
                </p>
              </div>
              <button data-act="toggle-breath" class="w-full py-2.5 rounded-full text-[13.5px] font-semibold cursor-pointer" style="background: var(--bw-accent); color: var(--bw-on-accent);">
                Pray this promise
              </button>
              <div class="text-[11.5px]" style="color: var(--bw-secondary);">Source: ${esc(verse.source)}</div>
            </div>`;
        } else if (state.desktopTab === 'truth') {
          const chain = TRUTH_CHAINS[state.chainId];
          const prev = chain.nodes.find((n) => n.id === state.chainNodePreviewId) || null;
          centerHtml = `
            <div class="max-w-[60ch] mx-auto space-y-5">
              <div class="flex items-center gap-2">
                ${Object.values(TRUTH_CHAINS)
                  .map(
                    (c) => `<button data-act="pick-chain" data-id="${c.id}" class="px-3 py-1 rounded-full text-[12.5px] border cursor-pointer" style="${
                      c.id === chain.id
                        ? 'background: var(--bw-accent); color: var(--bw-on-accent); border-color: var(--bw-accent);'
                        : 'background: var(--bw-elevated); border-color: var(--bw-border); color: var(--bw-secondary);'
                    }">${esc(c.tabLabel)}</button>`
                  )
                  .join('')}
              </div>
              ${
                prev
                  ? `<div class="space-y-4">
                      <button data-act="chain-back" class="px-3.5 py-1.5 rounded-full text-[12.5px] font-semibold cursor-pointer" style="background: var(--bw-accent); color: var(--bw-on-accent);">← Return to ${esc(chain.anchorRef)}</button>
                      <h2 class="font-display text-3xl">${esc(prev.ref)}</h2>
                      <p class="font-scripture text-[19px]" style="line-height: var(--bw-lh);">${esc(prev.text)}</p>
                    </div>`
                  : `<div class="space-y-4">
                      <h2 class="font-display text-3xl">${esc(chain.anchorRef)}</h2>
                      <div class="p-5 rounded-2xl border" style="background: var(--bw-surface); border-color: var(--bw-border-strong);">
                        <p class="font-scripture text-[20px]" style="line-height: var(--bw-lh);">
                          <span class="bw-dotted-part">${esc(chain.anchorPart1)}</span> <span class="bw-solid-promise">${esc(chain.anchorPart2)}</span>
                        </p>
                      </div>
                      <div class="text-[12.5px]" style="color: var(--bw-secondary);">${esc(chain.source)}</div>
                    </div>`
              }
            </div>`;
          rightHtml = `
            <div class="space-y-3">
              <div class="bw-micro-label" style="color: var(--sig-promise);">Illuminated Truth Thread</div>
              <div class="relative pl-5 ml-2 space-y-3" style="border-left: 1.5px solid var(--sig-promise);">
                ${chain.nodes
                  .map(
                    (nd) => `<button data-act="chain-node" data-id="${nd.id}" class="relative w-full text-left p-3 rounded-2xl border cursor-pointer" style="background: var(--bw-canvas); border-color: var(--bw-border);">
                      <span class="absolute -left-[27px] top-4 w-2.5 h-2.5 rounded-full border-2" style="background: var(--bw-surface); border-color: var(--sig-promise);"></span>
                      <div class="flex items-center justify-between text-[12.5px] font-semibold mb-1">
                        <span>${esc(nd.ref)}</span>
                        <span style="color: var(--sig-promise);">${esc(nd.tag)}</span>
                      </div>
                      <p class="font-scripture text-[13px]" style="color: var(--bw-secondary);">“${esc(nd.text)}”</p>
                    </button>`
                  )
                  .join('')}
              </div>
            </div>`;
        } else {
          const m = STORY_MOMENTS[state.storyId];
          centerHtml = `
            <div class="max-w-[60ch] mx-auto space-y-4">
              <div class="flex items-center gap-2">
                ${Object.values(STORY_MOMENTS)
                  .map(
                    (sm) => `<button data-act="pick-story" data-id="${sm.id}" class="px-3 py-1 rounded-full text-[12.5px] border cursor-pointer" style="${
                      sm.id === m.id
                        ? 'background: var(--bw-accent); color: var(--bw-on-accent); border-color: var(--bw-accent);'
                        : 'background: var(--bw-elevated); border-color: var(--bw-border); color: var(--bw-secondary);'
                    }">${esc(sm.eraShort)}</button>`
                  )
                  .join('')}
              </div>
              <div class="bw-micro-label" style="color: var(--bw-secondary);">${esc(m.subtitle)}</div>
              <h2 class="font-display text-4xl">${esc(m.title)}</h2>
              ${m.blocks
                .map((blk) => {
                  if (blk.type === 'divider') {
                    return `<div class="flex items-center gap-3 py-2"><span class="h-px flex-1" style="background: var(--bw-border-strong);"></span><span class="font-scripture italic text-[13px]" style="color: var(--bw-rubric);">${esc(blk.text)}</span><span class="h-px flex-1" style="background: var(--bw-border-strong);"></span></div>`;
                  }
                  if (blk.type === 'poetry') {
                    return `<div class="pl-4 space-y-2" style="border-left: 2px solid var(--sig-promise);">${blk.verses
                      .map((vs) => `<p class="font-scripture italic text-[17.5px]" style="line-height: 1.74;"><sup class="font-ui not-italic mr-1.5" style="color: var(--bw-verse); font-size: 11px;">${vs.v}</sup>${esc(vs.text).replace(/\n/g, '<br/>')}</p>`)
                      .join('')}</div>`;
                  }
                  return `<div class="space-y-2">${blk.verses
                    .map((vs) => `<p class="font-scripture text-[18px]" style="line-height: var(--bw-lh);"><sup class="font-ui mr-1.5" style="color: var(--bw-verse); font-size: 11px;">${vs.v}</sup>${esc(vs.text)}</p>`)
                    .join('')}</div>`;
                })
                .join('')}
            </div>`;
          rightHtml = `
            <div class="space-y-4 text-[13px]">
              <div class="bw-micro-label" style="color: var(--bw-accent);">${esc(m.eraName)}</div>
              <p class="leading-relaxed" style="color: var(--bw-secondary);">${esc(m.summary)}</p>
              <div class="p-3 rounded-2xl border space-y-1.5" style="background: var(--bw-canvas); border-color: var(--bw-border);">
                <div class="font-semibold flex items-center gap-1.5">${iconPin('var(--bw-accent)', 14)} ${esc(m.location)}</div>
                <div class="text-[12px]" style="color: var(--bw-secondary);">Figures: ${m.figures.map(esc).join(', ')}</div>
              </div>
              <div class="text-[12px] font-mono" style="color: var(--bw-accent);">Canonical: ${esc(m.canonicalCode)}</div>
            </div>`;
        }

        return `
          <div class="bw-desktop-frame bw-${theme} max-w-[1260px] mx-auto flex h-[690px]">
            ${sidebar}
            <div class="flex-1 overflow-y-auto bw-scroll px-10 py-8">${centerHtml}</div>
            <aside class="w-96 shrink-0 border-l p-6 overflow-y-auto bw-scroll" style="background: var(--bw-surface); border-color: var(--bw-border);">
              ${rightHtml}
            </aside>
          </div>`;
      }

      // =======================================================================
      // MASTER RENDER & EVENT DISPATCH
      // =======================================================================
      function render() {
        const root = document.getElementById('app-root');
        root.classList.toggle('bw-greyscale', state.greyscale);

        document.querySelectorAll('.board-mode-btn').forEach((b) => {
          const act = b.getAttribute('data-board-mode') === state.boardMode;
          b.className = `board-mode-btn px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer transition ${
            act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
          }`;
        });

        document.querySelectorAll('.theme-ov-btn').forEach((b) => {
          const act = b.getAttribute('data-theme-override') === state.themeOverride;
          b.className = `theme-ov-btn px-2.5 py-1 rounded text-xs font-medium cursor-pointer ${
            act ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'
          }`;
        });

        const greyBtn = document.getElementById('btn-greyscale');
        greyBtn.className = `px-2.5 py-1.5 rounded-lg border text-xs font-medium cursor-pointer transition ${
          state.greyscale ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : 'border-[var(--border)] text-[var(--muted-foreground)]'
        }`;

        const subBar = document.getElementById('sub-bar');
        const stage = document.getElementById('stage');

        if (state.boardMode === 'mobile5') {
          subBar.innerHTML = `
            <div>
              <strong class="text-[var(--foreground)]">5-Screen Design Board:</strong>
              Tap any verse in <strong>Screen 1</strong> to update the live Prayer Sheet in <strong>Screen 2</strong>, tap the underlined blank to personalize the prayer, tap any node in <strong>Truth Chain</strong>, or cycle eras in <strong>Unfolding Story</strong>.
            </div>
            <div class="font-mono">Screens 1–5 · Synchronized Interactive Prototype</div>`;

          const screens = [
            { title: '1 · Signals Reader', sub: 'Quiet Page ↔ Study Cards', html: renderScreen1(themeForScreen('selah')) },
            { title: '2 · Promise & Prayer Sheet', sub: 'Lamplight Sanctuary · Live Blank', html: renderScreen2(themeForScreen('lamplight')) },
            { title: '3 · Today’s Promise & Kept', sub: 'Spurgeon + Circumstances', html: renderScreen3(themeForScreen('parchment')) },
            { title: '4 · Truth Chain', sub: 'Illuminated Thread (FR-507)', html: renderScreen4(themeForScreen('parchment')) },
            { title: '5 · Unfolding Story', sub: 'Chronological Monograph', html: renderScreen5(themeForScreen('selah')) },
          ];

          stage.innerHTML = `
            <div class="flex flex-wrap justify-center gap-6 pb-6">
              ${screens
                .map(
                  (sc) => `<div class="space-y-2">
                    <div class="px-2 flex items-baseline justify-between">
                      <span class="text-xs font-semibold text-[var(--foreground)]">${sc.title}</span>
                      <span class="text-[11px] text-[var(--muted-foreground)]">${sc.sub}</span>
                    </div>
                    ${sc.html}
                  </div>`
                )
                .join('')}
            </div>`;
        } else {
          subBar.innerHTML = `
            <div>
              <strong class="text-[var(--foreground)]">Desktop &amp; iPad Studio:</strong>
              Switch between Scripture Signals, Truth Chain, and Unfolding Story using the left editorial rail.
            </div>
            <div class="font-mono">Theme: ${state.themeOverride === 'mix' ? 'selah' : state.themeOverride}</div>`;
          stage.innerHTML = renderDesktopStudio();
        }
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        if (btn.dataset.boardMode) {
          state.boardMode = btn.dataset.boardMode;
          render();
          return;
        }
        if (btn.dataset.themeOverride) {
          state.themeOverride = btn.dataset.themeOverride;
          render();
          return;
        }
        if (btn.id === 'btn-greyscale') {
          state.greyscale = !state.greyscale;
          render();
          return;
        }

        const act = btn.dataset.act;
        if (!act) return;

        if (act === 'toggle-signals') {
          state.signalsOn = !state.signalsOn;
        } else if (act === 'reader-mode') {
          state.readerMode = btn.dataset.val;
        } else if (act === 'sig-filter') {
          state.signalFilter = btn.dataset.val;
        } else if (act === 'sel-v') {
          state.selectedVerseNum = Number(btn.dataset.v);
          state.breathSanctuaryOpen = false;
          state.poolOpen = false;
        } else if (act === 'cycle-blank') {
          state.customBlank = '';
          state.blankIndex = (state.blankIndex + 1) % BLANK_PRESETS.length;
        } else if (act === 'toggle-edit-blank') {
          if (state.editingBlank) {
            const inp = document.getElementById('prayer-blank-input');
            if (inp) state.customBlank = inp.value;
          }
          state.editingBlank = !state.editingBlank;
        } else if (act === 'toggle-breath') {
          state.breathSanctuaryOpen = !state.breathSanctuaryOpen;
        } else if (act === 'toggle-pool') {
          state.poolOpen = !state.poolOpen;
        } else if (act === 'pick-pool') {
          state.keptInPool = btn.dataset.pool;
          state.poolOpen = false;
        } else if (act === 'jump-chain') {
          state.chainId = 'prov3_5';
          state.chainNodePreviewId = null;
          state.desktopTab = 'truth';
        } else if (act === 'toggle-today-keep') {
          state.todayKept = !state.todayKept;
        } else if (act === 'pick-circ') {
          state.circumstance = btn.dataset.circ;
          state.circumstanceKept = '';
        } else if (act === 'keep-circ') {
          state.circumstanceKept = btn.dataset.ref;
        } else if (act === 'toggle-testimony') {
          state.showTestimony = !state.showTestimony;
        } else if (act === 'pick-chain') {
          state.chainId = btn.dataset.id;
          state.chainNodePreviewId = null;
        } else if (act === 'chain-node') {
          state.chainNodePreviewId = btn.dataset.id;
        } else if (act === 'chain-back') {
          state.chainNodePreviewId = null;
        } else if (act === 'toggle-chain-pulse') {
          state.chainPulse = !state.chainPulse;
        } else if (act === 'cycle-story') {
          const order = ['adullam', 'hezekiah', 'rome'];
          state.storyId = order[(order.indexOf(state.storyId) + 1) % order.length];
          state.storyDrawerOpen = false;
        } else if (act === 'pick-story') {
          state.storyId = btn.dataset.id;
          state.storyDrawerOpen = false;
        } else if (act === 'toggle-story-sig') {
          state.storySignalsOn = !state.storySignalsOn;
        } else if (act === 'toggle-story-drawer') {
          state.storyDrawerOpen = !state.storyDrawerOpen;
        } else if (act === 'desktop-tab') {
          state.desktopTab = btn.dataset.id;
        }

        render();
      });

      render();
    })();
  </script>
</body>
</html>
